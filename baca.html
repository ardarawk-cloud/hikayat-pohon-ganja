<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Baca Arsip — Hikayat Pohon Ganja</title><style>body{margin:0;background:#07140e;color:#e9e0c7;font:18px/1.8 Georgia,serif}header,main,footer{max-width:780px;margin:auto;padding:24px}a{color:#d6b15e}h1{font-size:clamp(36px,6vw,58px);line-height:1.15}small{color:#d6b15e}.notice{background:#14271b;padding:16px;border-left:3px solid #d6b15e;font:15px/1.6 Arial,sans-serif}footer{border-top:1px solid #40533f;font:13px Arial,sans-serif}</style></head><body><header><a href="/arsip.html">← Arsip</a></header><main><small id="number"></small><h1 id="title"></h1><p class="notice" id="notice"></p><article id="body"></article><p><a id="prev">← Sebelumnya</a> · <a id="next">Berikutnya →</a></p></main><footer>Hikayat Pohon Ganja · AM STUDIO</footer><script>const n=Number(new URLSearchParams(location.search).get('episode'));const titles={2:'Bagaimana Ilmuwan Mengenali Cannabis',3:'Struktur dan Siklus Hidup Cannabis',4:'THC, CBD, dan Senyawa Cannabis',5:'Hemp dalam Sejarah Serat dan Biji',6:'Mengenal Sistem Endocannabinoid'};const paragraphs={2:'Cannabis adalah genus tumbuhan berbunga dalam famili Cannabaceae. Nama Cannabis sativa L. banyak digunakan, tetapi pengelompokan internalnya masih diteliti. Identifikasi botani tidak cukup dilakukan hanya dengan melihat bentuk daun. Ilmuwan mempertimbangkan ciri morfologi, asal spesimen, dan analisis genetik. Dalam sejarah, nama tanaman pada naskah kuno belum tentu identik dengan spesies modern tanpa pemeriksaan bahasa dan bukti pendukung.',3:'Seperti tumbuhan berbunga lainnya, cannabis mempunyai akar, batang, daun, dan struktur reproduksi. Keragaman ciri fisik dapat muncul karena genetika dan lingkungan. Ilmuwan meneliti hubungan antara variasi tersebut, adaptasi, dan sejarah domestikasi. Bab ini merupakan pengantar botani, bukan petunjuk budidaya.',4:'Cannabis menghasilkan beragam senyawa. THC dikenal karena efek psikoaktifnya, sementara CBD mempunyai profil farmakologi berbeda. Kandungan dan efek tidak dapat disimpulkan hanya dari sebutan sativa atau indica. Klaim medis harus dibedakan menurut mutu bukti, bentuk produk, dan persetujuan regulator. Efek samping serta interaksi obat juga harus dipertimbangkan.',5:'Hemp adalah istilah pertanian dan hukum yang umumnya merujuk pada cannabis untuk serat, biji, atau industri. Seratnya tercatat dalam berbagai tradisi material, termasuk tali dan tekstil. Bukti arkeologi dan dokumen perdagangan perlu diperiksa menurut lokasi dan zamannya. Batas hukum hemp berbeda-beda antarnegara.',6:'Sistem endocannabinoid melibatkan molekul sinyal yang dibuat tubuh, reseptor seperti CB1 dan CB2, serta enzim yang mengatur molekul tersebut. Sistem ini dipelajari dalam sejumlah proses fisiologis. Senyawa cannabis tertentu dapat memengaruhi jalur ini, tetapi hubungan biologis tidak otomatis membuktikan manfaat klinis. Penelitian dasar harus dibedakan dari uji klinis dan obat yang telah disetujui.'};if(!Number.isInteger(n)||n<1||n>41)location.replace('/arsip.html');else if(n===1)location.replace('/bab-01.html');else{document.querySelector('#number').textContent='EPISODE '+String(n).padStart(2,'0');document.querySelector('#title').textContent=titles[n]||'Arsip Episode '+String(n).padStart(2,'0');document.querySelector('#notice').textContent=paragraphs[n]?'Naskah rekonstruksi editorial, bukan artikel asli. Draft ringkas, belum melewati verifikasi referensi per klaim.':'Naskah episode asli belum tersedia. Silakan lihat judul di katalog; isi tidak akan direkayasa.';if(paragraphs[n]){const p=document.createElement('p');p.textContent=paragraphs[n];document.querySelector('#body').append(p)}document.querySelector('#prev').href=n===2?'/bab-01.html':'/baca.html?episode='+(n-1);document.querySelector('#next').href=n===41?'/arsip.html':'/baca.html?episode='+(n+1)}</script></body></html>
